<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
<title id="title">A reviewable AI workflow</title>
<desc id="desc">Four steps: define the task, ground it in evidence, set boundaries, and verify the result.</desc>
<rect width="1200" height="260" rx="4" fill="#08090A"/>
<path d="M0 0h245l-8 7H0z" fill="#D5FF3F"/>
<rect x="1" y="1" width="1198" height="258" fill="none" stroke="#373A3D" stroke-width="2"/>
<text x="42" y="45" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.6" fill="#D5FF3F">A SMALL SYSTEM FOR HIGHER-QUALITY WORK</text>
<g font-family="Arial,sans-serif">
 <path d="M38 76h242l16 16v112H54l-16-16z" fill="#0D0F10" stroke="#3A3D40"/>
 <path d="M38 76h73l-5 5H38z" fill="#D5FF3F"/>
 <text x="60" y="111" font-size="12" font-weight="700" letter-spacing="1.5" fill="#9AA1A6">01 / SCOPE</text>
 <text x="60" y="145" font-size="22" font-weight="700" fill="#F6F7F8">Name the job</text>
 <text x="60" y="174" font-size="15" fill="#CFD2D5">Outcome · audience · done</text>
 <path d="M296 132h27m-8-8 8 8-8 8" fill="none" stroke="#D5FF3F" stroke-width="2"/>
 <path d="M337 76h242l16 16v112H353l-16-16z" fill="#0D0F10" stroke="#3A3D40"/>
 <path d="M337 76h73l-5 5h-68z" fill="#D5FF3F"/>
 <text x="359" y="111" font-size="12" font-weight="700" letter-spacing="1.5" fill="#9AA1A6">02 / GROUND</text>
 <text x="359" y="145" font-size="22" font-weight="700" fill="#F6F7F8">Name the evidence</text>
 <text x="359" y="174" font-size="15" fill="#CFD2D5">Sources · gaps · freshness</text>
 <path d="M595 132h27m-8-8 8 8-8 8" fill="none" stroke="#D5FF3F" stroke-width="2"/>
 <path d="M636 76h242l16 16v112H652l-16-16z" fill="#0D0F10" stroke="#3A3D40"/>
 <path d="M636 76h73l-5 5h-68z" fill="#D5FF3F"/>
 <text x="658" y="111" font-size="12" font-weight="700" letter-spacing="1.5" fill="#9AA1A6">03 / BOUND</text>
 <text x="658" y="145" font-size="22" font-weight="700" fill="#F6F7F8">Set authority</text>
 <text x="658" y="174" font-size="15" fill="#CFD2D5">Scope · tools · approvals</text>
 <path d="M894 132h27m-8-8 8 8-8 8" fill="none" stroke="#D5FF3F" stroke-width="2"/>
 <path d="M935 76h227l16 16v112H951l-16-16z" fill="#0D0F10" stroke="#3A3D40"/>
 <path d="M935 76h73l-5 5h-68z" fill="#D5FF3F"/>
 <text x="957" y="111" font-size="12" font-weight="700" letter-spacing="1.5" fill="#9AA1A6">04 / VERIFY</text>
 <text x="957" y="145" font-size="22" font-weight="700" fill="#F6F7F8">Check the work</text>
 <text x="957" y="174" font-size="15" fill="#CFD2D5">Criteria · risks · gaps</text>
</g>
<path d="M42 226h1116" stroke="#2C3033"/>
<text x="42" y="246" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#899197">REPEATABLE PROMPTS START WITH CLEAR INPUTS AND END WITH AN HONEST REVIEW</text>
</svg>